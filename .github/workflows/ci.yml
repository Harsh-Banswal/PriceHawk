name: CI Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint-and-unit-tests:
    name: Lint & Scraper Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'server/package-lock.json'

      - name: Install server dependencies
        run: npm ci
        working-directory: ./server

      - name: Syntax and Lint Verification
        run: |
          node --check src/index.js
          node --check src/config.js
          node --check src/services/reconciler.js
          node --check src/scraper/priceExtractor.js
          node --check src/scraper/waitForStablePrice.js
          node --check src/scraper/retry.js
          node --check src/scraper/scrapeProduct.js
          node --check src/scraper/runScrapeCycle.js
        working-directory: ./server

      - name: Run Price Reconciler & Retry Unit Tests
        run: node --test tests/reconciler.test.js tests/scraper_components.test.js
        working-directory: ./server
